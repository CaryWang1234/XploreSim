<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XploreSim · FRC match simulators for two seasons</title>
<meta name="description" content="XploreSim hub: the entry points for two browser FRC match simulators and tactical planners — 2026 REBUILT and 2025 REEFSCAPE.">
<meta name="theme-color" content="#0c0d0f">
<meta property="og:title" content="XploreSim · FRC match simulators for two seasons">
<meta property="og:description" content="Two entries, one per season: a 0.1 s tick engine and a segment-by-segment tactical planner for the 2026 REBUILT and 2025 REEFSCAPE games.">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
:root {
  --bg: #0c0d0f;
  --panel: #121417;
  --panel-2: #171a1e;
  --line: #2a2f36;
  --text: #ecebe6;
  --dim: #a3a8ae;
  --faint: #868c94;
  --rebuilt: #c9a45c;
  --reefscape: #5ccfd0;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr;
  font-family: var(--sans);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ---------- the carpet, flattened: a static hairline grid, nothing runs ---------- */

.bg {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(to right, rgba(236, 235, 230, .04) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(236, 235, 230, .04) 1px, transparent 1px);
  background-size: 112px 112px;
  -webkit-mask-image: radial-gradient(120% 90% at 50% 42%, #000 0%, rgba(0, 0, 0, .5) 58%, transparent 88%);
  mask-image: radial-gradient(120% 90% at 50% 42%, #000 0%, rgba(0, 0, 0, .5) 58%, transparent 88%);
}

/* ---------- title bar ---------- */

.bar {
  position: sticky;
  top: 0;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 11px clamp(18px, 4vw, 32px);
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}

.mark {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--text);
  white-space: nowrap;
}
.mark img { display: block; width: 28px; height: 28px; }
.mark em {
  font-family: var(--sans);
  font-style: normal;
  font-weight: 400;
  font-size: 11.5px;
  letter-spacing: .02em;
  text-transform: none;
  color: var(--faint);
}
.host {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .06em;
  color: var(--faint);
  text-align: right;
  min-width: 0;
  overflow-wrap: anywhere;
}

/* ---------- the two entries ---------- */

.stage {
  display: grid;
  place-items: center;
  padding: clamp(40px, 10vh, 96px) clamp(18px, 5vw, 42px);
  position: relative;
  z-index: 1;
}
.entries {
  width: min(680px, 100%);
  display: grid;
  gap: 12px;
}

.go {
  position: relative;
  display: grid;
  grid-template-columns: 1fr auto auto;
  grid-template-areas:
    "year piece arrow"
    "name piece arrow";
  align-items: center;
  column-gap: 16px;
  padding: 15px 18px 15px 23px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--panel);
  color: var(--text);
  text-decoration: none;
  transition: border-color .18s ease, background-color .18s ease;
}
.go::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 3px;
  border-radius: 7px 0 0 7px;
  background: var(--tone);
}
.go:hover, .go:focus-visible {
  border-color: var(--tone);
  background: var(--panel-2);
}
.go:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

.go.rebuilt { --tone: var(--rebuilt); }
.go.reefscape { --tone: var(--reefscape); }

.piece {
  grid-area: piece;
  align-self: center;
  display: block;
  width: 54px;
  height: 54px;
}
.yr {
  grid-area: year;
  align-self: end;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .14em;
  color: var(--faint);
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.name {
  grid-area: name;
  align-self: start;
}
.name b {
  display: block;
  font-family: var(--mono);
  font-size: clamp(16px, 2.2vw, 18px);
  font-weight: 600;
  letter-spacing: .04em;
  line-height: 1.2;
}
.name em {
  display: block;
  font-style: normal;
  margin-top: 4px;
  font-size: 12px;
  line-height: 1.45;
  color: var(--dim);
}
.name i {
  font-family: var(--mono);
  font-style: normal;
  color: var(--tone);
}
.arrow {
  grid-area: arrow;
  align-self: center;
  font-family: var(--mono);
  font-size: 15px;
  line-height: 1;
  color: var(--tone);
  transition: transform .18s ease;
}
.go:hover .arrow, .go:focus-visible .arrow { transform: translateX(4px); }

@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.reveal { animation: rise .45s ease both; animation-delay: var(--d, 0s); }

@media (max-width: 560px) {
  .bar { flex-wrap: wrap; gap: 6px; }
  .mark { font-size: 12px; letter-spacing: .12em; }
  .mark em { display: none; }
  .host { width: 100%; text-align: left; font-size: 10px; letter-spacing: .02em; }
  .go { column-gap: 12px; padding: 14px 14px 14px 19px; }
  .piece { width: 44px; height: 44px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .reveal { opacity: 1; transform: none; }
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="grid"></div>
</div>

<header class="bar reveal">
  <span class="mark"><img src="icon.svg" alt="" width="28" height="28">XploreSim<em>FRC match simulators</em></span>
  <span class="host">xploresim.salmoncat0304.xyz</span>
</header>

<main class="stage">

  <nav class="entries" aria-label="Season consoles">
    <a class="go rebuilt reveal" style="--d:.1s" href="/rebuilt/">
      <span class="yr">2026</span>
      <img class="piece" src="rebuilt-piece.svg" alt="" width="54" height="54">
      <span class="name"><b>REBUILT</b><em>Drive the <i>HUB</i> · climb the <i>TOWER</i> · planner included</em></span>
      <span class="arrow" aria-hidden="true">&rarr;</span>
    </a>

    <a class="go reefscape reveal" style="--d:.18s" href="/reefscape/">
      <span class="yr">2025</span>
      <img class="piece" src="reefscape-piece.svg" alt="" width="54" height="54">
      <span class="name"><b>REEFSCAPE</b><em>Stock the <i>REEF</i> · clear the <i>PROCESSOR</i> · cage depth</em></span>
      <span class="arrow" aria-hidden="true">&rarr;</span>
    </a>
  </nav>

</main>

</body>
</html>
