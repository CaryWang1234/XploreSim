<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · XploreSim</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0d0f">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
:root { --bg:#0c0d0f; --panel:#121417; --panel-2:#171a1e; --line:#2a2f36;
  --text:#ecebe6; --dim:#a3a8ae; --faint:#868c94; --accent:#c9a45c;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif; }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; padding:40px 20px;
  font-family:var(--sans); color:var(--text); background:var(--bg); }
main { width:min(520px,100%); }
p.mono { font-family:var(--mono); font-size:11px; letter-spacing:.2em; color:var(--faint); margin:0; }
h1 { font-family:var(--mono); font-size:56px; margin:10px 0 0; letter-spacing:-.02em; color:var(--accent); }
p { color:var(--dim); margin:12px 0 0; line-height:1.65; }
ul { list-style:none; margin:24px 0 0; padding:0; display:grid; gap:8px; }
a { display:block; text-decoration:none; border:1px solid var(--line); border-radius:7px; background:var(--panel);
  padding:13px 14px; color:var(--text); font-size:14px;
  transition:border-color .18s ease, background-color .18s ease; }
a:hover, a:focus-visible { border-color:var(--accent); background:var(--panel-2); }
a:focus-visible { outline:2px solid var(--text); outline-offset:3px; }
a span { font-family:var(--mono); font-size:11px; color:var(--faint); letter-spacing:.1em; margin-left:8px; }
</style>
</head>
<body>
<main>
  <p class="mono">XploreSim · TACTICAL CONSOLE</p>
  <h1>404</h1>
  <p>This domain is a signpost. There are no pages outside the site root — both season consoles are one click below.</p>
  <ul>
    <li><a href="/rebuilt/">2026 REBUILT console<span>→</span></a></li>
    <li><a href="/reefscape/">2025 REEFSCAPE console<span>→</span></a></li>
    <li><a href="/"><span style="margin-left:0">Back to the hub</span></a></li>
  </ul>
</main>
</body>
</html>
